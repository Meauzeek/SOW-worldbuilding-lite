<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随星录 · 世界观设定集</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="rankings.css"></head><body>
<header><a href="./" class="brand">随星录 <small>世界观设定集 · LITE</small></a><nav><button id="mapToggle">收起地图</button><button id="rankingsBtn" disabled>排行榜</button><button id="importBtn">导入设定</button><button id="exportBtn" disabled>下载设定 JSON</button><a href="https://github.com/Meauzeek/SOW-worldbuilding-lite">仓库 ↗</a></nav></header>
<main><aside><input id="search" type="search" placeholder="搜索名称、原型或设定…" aria-label="搜索设定"><div class="tabs"><button id="countriesTab" class="active">国家 / 地区</button><button id="citiesTab">城市</button></div><div id="list" role="list" aria-label="设定目录">正在加载…</div><button id="addCity" disabled>＋ 新建城市</button></aside><section class="workspace"><div class="map-wrap" id="mapWrap"><div class="map-tools"><span>拖动平移 · 滚轮缩放</span><label><input id="names" type="checkbox" checked>地名</label><label><input id="stars" type="checkbox" checked>★ 星标</label><button id="reset">全图</button></div><svg id="map" viewBox="0 0 1000 540" role="img" aria-label="世界疆域和城市地图"></svg></div><article id="details"><h1>世界观设定集</h1><p>选择国家或城市，阅读与编辑设定。</p></article></section></main>
<footer><span id="status" role="status">正在读取设定</span><a href="docs/AI_CONTEXT.md">设定说明</a><a href="https://meauzeek.github.io/SOW/atlas/">完整版 ↗</a></footer>
<dialog id="editor"><form id="editForm"><div class="dialog-head"><h2>编辑设定</h2><button type="button" id="closeEditor" aria-label="关闭">×</button></div><div class="fields"><label>中文名称<input name="name" required maxlength="200"></label><label>外文名称<input name="englishName" maxlength="200"></label><label>本地名称<input name="localName" maxlength="200"></label><label>本地语言<input name="localLanguage" maxlength="40"></label><label>人口（人）<input name="population" type="number" min="0" step="1"></label><label>GDP（亿美元）<input name="gdpHundredMillionUSD" type="number" min="0" step="any"></label><label>现实对应 / 原型<input name="realName" maxlength="300"></label><label id="ownerField">所属国家<select name="countryId"></select></label><label id="lonField">经度<input name="lon" type="number" min="-180" max="180" step="any"></label><label id="latField">纬度<input name="lat" type="number" min="-90" max="90" step="any"></label><label><input name="featured" type="checkbox">★ 小说重要地点</label><label id="charactersField" class="wide">关联角色<textarea name="relatedCharacters" rows="5" placeholder="姓名｜关系（出身、居留、牺牲等）｜说明｜来源"></textarea></label><label class="wide">设定备注<textarea name="notes" rows="7"></textarea></label></div><div class="dialog-actions"><button type="button" id="deleteCity" hidden>删除城市</button><button type="submit">保存修改</button></div></form></dialog><input id="file" type="file" accept=".json" hidden>
<script src="vendor/d3.min.js"></script><script src="vendor/d3-geo-projection.min.js"></script><script type="module" src="app.js"></script></body></html>
